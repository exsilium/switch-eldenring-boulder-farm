; PlatformIO Project Configuration File
;
; Switch Pro Controller emulation — Adafruit Feather ESP32-S3 TFT.
;
; Migrated from the Arduino framework to ESP-IDF + raw TinyUSB. Validation proved
; the Arduino composite USB stack was the blocker (the Switch never drove the
; handshake); raw esp_tinyusb on IDF makes the console accept the controller.
;
; Build:  pio run
; Upload: put the board in bootloader (hold BOOT, tap RESET), then  pio run -t upload
;
; No serial console is possible (the single USB-C port is the USB-OTG port); the
; onboard NeoPixel shows status: RED=not mounted, BLUE=mounted/no handshake,
; YELLOW=handshake underway, GREEN=accepted. Phase 2 adds the LVGL TFT UI.

; Only the firmware env is built by `pio run` / the VS Code build task. The
; host-test `native` env below is opt-in (`pio test -e native`) so a plain build
; never requires a host g++ toolchain.
[platformio]
default_envs = feather_s3_idf

[env:feather_s3_idf]
; Latest official PlatformIO espressif32 platform (ESP-IDF 6.0.x). The earlier
; "device not recognized" on the official platform was NOT the platform -- it
; was the FreeRTOS tick rate (CONFIG_FREERTOS_HZ, now 1000 in sdkconfig.defaults).
; With that fixed, the official/latest toolchain works (and its GCC does not
; segfault on esp_lcd, unlike the pioarduino fork).
platform = espressif32
board = adafruit_feather_esp32s3_tft
framework = espidf
monitor_speed = 115200
build_flags = -DCFG_TUD_ENDPOINT0_SIZE=64

; Host-side unit-test environment (no hardware / ESP-IDF required). Runs the
; dependency-light engine + rumble-decode tests under test/ with the PlatformIO
; native platform + Unity:  pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<engine.cpp>
build_flags = -I src -std=gnu++17

