name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Docker firmware build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: switch-firmware-builder:ci
          # Cache the espressif32 platform + ESP-IDF toolchain download (baked
          # into the image) across runs to keep build times reasonable.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build firmware (pio run -e feather_s3_idf)
        run: |
          docker run --rm -v "${{ github.workspace }}:/project" \
            switch-firmware-builder:ci

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-feather_s3_idf
          path: |
            .pio/build/feather_s3_idf/firmware.elf
            .pio/build/feather_s3_idf/firmware.bin
          if-no-files-found: error
